# Use this so the public site is ONLY the Node/PM2 app.
# When `pm2 stop chatrix` runs, visitors get 502 (site down), not a leftover page.
#
#   sudo cp nginx.chatrix.conf /etc/nginx/sites-available/chatrix
#   # edit server_name
#   sudo ln -sf /etc/nginx/sites-available/chatrix /etc/nginx/sites-enabled/chatrix
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
